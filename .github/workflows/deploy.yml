name: Deploy to Cloudflare Worker

on:
  # Runs when Check finishes on `main`, and deploys only if Check passed, so what reaches
  # production is exactly the commit every check accepted. A separate workflow rather than a job
  # in Check ON PURPOSE: `bin/align-probe.sh` reads the newest `deploy.yml` run on `main` to tell
  # whether the live site is current.
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      # No `id-token` ON PURPOSE: with it, the Nix installer spends seconds on a FlakeHub sign-in
      # this repository has no account for. Nothing here uses OIDC.
      contents: read
    steps:
      - name: Require the deployment settings
        env:
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          where="(Settings → Secrets and variables → Actions)"
          [ -n "$WORKER_NAME" ] || { echo "::error::Set the repository variable CLOUDFLARE_WORKER_NAME to the Worker's name $where" && exit 1; }
          [ -n "$PUBLIC_SUPABASE_URL" ] || { echo "::error::Set the repository variable PUBLIC_SUPABASE_URL to the production Supabase project URL $where" && exit 1; }
          [ -n "$APP_ORIGINS" ] || { echo "::error::Set the repository variable APP_ORIGINS to the comma-separated origins allowed to call the API $where" && exit 1; }
          [ -n "$LOG_LEVEL" ] || { echo "::error::Set the repository variable LOG_LEVEL to an Effect log level such as Info $where" && exit 1; }
          # Required even with a Hyperdrive bound: the binding exists only inside the Worker, and the
          # migration step below needs a direct connection string.
          [ -n "$DB_URL" ] || { echo "::error::Set the secret DB_URL to the production Supabase session pooler's connection string (port 5432), used to migrate the database and, when no Hyperdrive is bound, by the Worker $where" && exit 1; }
      # The commit Check ran on, not the branch head: a push that lands while Check is still
      # running must not get deployed ahead of its own Check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Restores the snapshot the Check run that triggered this one saved, so the build below is
      # substitution, not compilation. No `nix flake check` here: Check already ran every check on
      # this commit, and this job does not start unless they passed.
      - uses: ./.github/actions/nix
      - name: Build
        working-directory: apps/server
        # `server-worker` first, so `result` still names the Worker. `db-migrator` is in `checks`, so
        # it too comes out of the restored snapshot.
        run: nix build "$GITHUB_WORKSPACE#server-worker" "$GITHUB_WORKSPACE#db-migrator"
      - name: Wrangler config
        id: config
        uses: ./.github/actions/wrangler-config
        with:
          working-directory: apps/server
          hyperdrive-id: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
      # Migrate, then audit, before the new code goes live: if either fails, nothing deploys, so new
      # code never serves against an old schema. The previous code serves against the new schema
      # until the deploy below finishes (and indefinitely if it fails, or after a rollback), which
      # is why every migration must be backward compatible. Re-running is safe: the migrator
      # applies only what the ledger lacks, all of it in one transaction.
      - name: Migrate production
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: nix run "$GITHUB_WORKSPACE#db-migrator"
      - name: Deploy
        id: deploy
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON object per line here; the deploy record carries the deployed
          # URLs, which is sturdier than scraping them out of the human-readable log.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CONFIG: ${{ steps.config.outputs.path }}
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          args=(
            deploy --config "$CONFIG" --name "$WORKER_NAME"
            --var "PUBLIC_SUPABASE_URL:$PUBLIC_SUPABASE_URL"
            --var "APP_ORIGINS:$APP_ORIGINS"
            --var "LOG_LEVEL:$LOG_LEVEL"
          )
          # With a Hyperdrive bound, the deploy uploads no DB_URL: the binding is the database, and
          # the Worker reads it in preference to any DB_URL secret an earlier preview version left
          # behind (an upload never drops a secret). Without one, DB_URL is the database, uploaded
          # as a secret rather than a var so it shows in neither the dashboard nor this log.
          if [ -z "$HYPERDRIVE_ID" ]; then
            jq -n --arg url "$DB_URL" '{ DB_URL: $url }' > "$RUNNER_TEMP/secrets.json"
            args+=(--secrets-file "$RUNNER_TEMP/secrets.json")
          fi
          # `--inputs-from` resolves `nixpkgs` to the flake's locked input, so this deploys with the
          # same wrangler the dev shell and the preview run, out of the restored snapshot.
          nix run --inputs-from "$GITHUB_WORKSPACE" nixpkgs#wrangler -- "${args[@]}"
          # The custom domain wins once a fork sets it; until then the badge links to workers.dev.
          url="${PRODUCTION_URL:-$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")}"
          if [ -z "$url" ]; then
            echo "::error::wrangler did not report a deployed URL and PRODUCTION_URL is unset" && exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The deployed version, read back from Cloudflare. With a Hyperdrive id: exactly one
      # Hyperdrive binding, named HYPERDRIVE, because the binding is what the Worker reads and
      # production's database rides on it. No assertion about DB_URL in that case ON PURPOSE: a
      # DB_URL secret an earlier preview version left behind stays in the version and is ignored.
      # Without an id: no Hyperdrive binding and the DB_URL secret present, because DB_URL is then
      # the database.
      - name: Check the deployed version's shape
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT: ${{ runner.temp }}/wrangler-output.ndjson
          CONFIG: ${{ steps.config.outputs.path }}
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          id=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT")
          if [ -z "$id" ]; then
            echo "::error::wrangler did not report the deployed version's id" && exit 1
          fi
          nix run --inputs-from "$GITHUB_WORKSPACE" nixpkgs#wrangler -- versions view "$id" \
            --config "$CONFIG" --name "$WORKER_NAME" --json > "$RUNNER_TEMP/version.json"
          if [ -n "$HYPERDRIVE_ID" ]; then
            if ! jq -e '[.resources.bindings[] | select(.type == "hyperdrive")] | length == 1 and .[0].name == "HYPERDRIVE"' "$RUNNER_TEMP/version.json" > /dev/null; then
              echo "::error::Deployed version $id of $WORKER_NAME does not bind exactly one Hyperdrive named HYPERDRIVE, so the Worker is not reading production's database through CLOUDFLARE_HYPERDRIVE_ID. Check the generated wrangler config."
              exit 1
            fi
            echo "Deployed version $id binds HYPERDRIVE"
          else
            if ! jq -e '[.resources.bindings[] | select(.type == "hyperdrive")] | length == 0' "$RUNNER_TEMP/version.json" > /dev/null; then
              echo "::error::Deployed version $id of $WORKER_NAME carries a Hyperdrive binding although CLOUDFLARE_HYPERDRIVE_ID is unset. Check the generated wrangler config."
              exit 1
            fi
            if ! jq -e '[.resources.bindings[] | select(.type == "secret_text" and .name == "DB_URL")] | length == 1' "$RUNNER_TEMP/version.json" > /dev/null; then
              echo "::error::Deployed version $id of $WORKER_NAME carries no DB_URL secret and binds no Hyperdrive, so it has no database. The deploy must pass DB_URL with --secrets-file when CLOUDFLARE_HYPERDRIVE_ID is unset."
              exit 1
            fi
            echo "Deployed version $id binds no Hyperdrive and carries its DB_URL secret"
          fi
