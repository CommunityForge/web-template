name: Deploy to Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the Worker name
        if: vars.CLOUDFLARE_WORKER_NAME == ''
        run: echo "::error::Set the repository variable CLOUDFLARE_WORKER_NAME to the Worker's name (Settings → Secrets and variables → Actions → Variables)" && exit 1
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check
        run: nix flake check
      - name: Build
        working-directory: apps/frontend
        run: nix build "$GITHUB_WORKSPACE#frontend"
      - name: Deploy
        id: deploy
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON object per line here; the deploy record carries the deployed
          # URLs, which is sturdier than scraping them out of the human-readable log.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          nix run nixpkgs#wrangler -- deploy --name "$WORKER_NAME"
          # The custom domain wins once a fork sets it; until then the badge links to workers.dev.
          url="${PRODUCTION_URL:-$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")}"
          if [ -z "$url" ]; then
            echo "::error::wrangler did not report a deployed URL and PRODUCTION_URL is unset" && exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
