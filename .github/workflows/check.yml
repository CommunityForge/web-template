name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled `main` run saves no store snapshot, and the snapshot is what every later job
  # restores from, so `main` runs always finish. Pull requests still cancel on a new push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # No `id-token` ON PURPOSE: with it, the Nix installer spends seconds on a FlakeHub sign-in
      # this repository has no account for. Nothing here uses OIDC.
      contents: read
      # `main` saves the store snapshot and deletes the ones it supersedes, and deleting caches
      # needs Actions write. Permissions cannot be conditional, so pull requests carry it too; they
      # only restore, and a fork's or Dependabot's token is read-only regardless.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      # One job for every check, not a matrix: a whole-store snapshot can only be taken from one
      # store, and one restore serves all of them. `--keep-going` reports every failing check
      # rather than the first; `-L` keeps the failing derivation's log in this output.
      - name: Check
        run: nix flake check -L --keep-going
      # `nix flake check` roots nothing, so without this the garbage collection that precedes the
      # save would delete the very outputs the snapshot exists to carry. Out-links under the
      # runner's temp directory live until the job ends, which is after the post-phase save.
      # The flake inputs' source trees are rooted too: evaluation copies each one into the store,
      # no output references them, and nixpkgs alone is 330 MB that every job would otherwise
      # download again before it can evaluate.
      - name: Root the check outputs and the flake inputs for the snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          nix eval --raw .#checks.x86_64-linux \
            --apply 'checks: builtins.concatStringsSep "\n" (map (name: ".#checks.x86_64-linux." + name) (builtins.attrNames checks))' \
            | xargs nix build --out-link "$RUNNER_TEMP/roots/check"
          nix flake archive --json \
            | jq -r '.. | .path? // empty' \
            | xargs nix build --out-link "$RUNNER_TEMP/roots/input"
