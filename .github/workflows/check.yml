name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        if: ${{ !env.ACT }}
      - id: list
        run: |
          checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          if [ "$checks" = "[]" ]; then
            echo "::error::no checks found in flake" && exit 1
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      # No `id-token` ON PURPOSE: with it, the Nix installer and Magic Nix Cache each spend seconds
      # on a FlakeHub sign-in this repository has no account for. Nothing here uses OIDC.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
      # Magic Nix Cache registers itself ahead of cache.nixos.org, so every nixpkgs path would
      # otherwise be looked up (and re-uploaded) through the rate-limited GitHub Actions cache.
      # Priority 0 puts the official cache first; the Actions cache then serves only this flake's
      # own outputs.
      - uses: DeterminateSystems/nix-installer-action@main
        if: ${{ !env.ACT }}
        with:
          extra-conf: |
            substituters = https://cache.nixos.org?priority=0
      - uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ !env.ACT }}
      - run: nix build .#checks.x86_64-linux.${{ matrix.check }} -L --no-link
