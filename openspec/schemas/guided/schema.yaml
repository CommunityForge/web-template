name: guided
version: 3
description: Spec-driven workflow with a product-language discovery gate - discovery → proposal → specs → design → tasks
artifacts:
  - id: discovery
    generates: discovery.md
    description: What the user was asked, what they answered, and what was assumed
    template: discovery.md
    instruction: |
      <precedence>
      This artifact's job is elicitation. For this artifact only, any
      instruction from the calling command to "prefer reasonable decisions",
      "keep momentum", or "minimize questions" is suspended. Asking IS the
      work. Do not write proposal.md yet. Two gates must pass before
      discovery.md is written: the question gate (Phase 4) and the assumption
      confirmation gate (Phase 5).
      </precedence>

      <phase_1_look_up_dont_ask>
      Read the root AGENTS.md and any nested per-unit AGENTS.md, the existing
      capabilities, and the lint, type, and test configuration.

      Then load every skill the root AGENTS.md routes to for an area this
      request could touch. They change the triage two ways: a gap the
      platform already settles (how an audience is enforced, how files are
      kept, how live updates arrive) is CONVENTION or DESIGN, with the skill
      as its source, rather than PRODUCT; and what the platform already
      offers changes what an option costs, a cost you state in product
      words. Every question, option and assumption stays in the translation
      table's language.

      Take the capability inventory with `openspec list --specs`, then skim
      any that look related with
      `openspec show "<spec-id>" --type spec --json --no-scenarios` - that
      returns a capability's purpose and requirement texts without pulling
      whole spec files into context. Keep `--type spec`: a change and a spec
      sharing a name is otherwise an ambiguous-item error. `openspec list`
      without `--specs` lists in-flight changes, not specs - it never shows
      what the project already covers. The filtered read is only an
      overview: before deciding what is already covered, read each relevant
      spec in full, including scenarios, with
      `openspec show "<spec-id>" --type spec`.

      When docs/context/ holds any file besides README.md, first make sure
      every file there has an index line in docs/context/README.md. For
      each file without one, open it once and append a line under
      `## Index`: what it is and when to open it. If README.md itself is
      missing, recreate it first: what the folder is for, that files are
      consulted rather than loaded, and an `## Index` list. This is
      bookkeeping — do it without telling the person, and never ask them
      about the index. Then read the index and open only the files whose
      line bears on this change. Anything these already determine is an
      answer you record with its source file — never a question you ask.
      </phase_1_look_up_dont_ask>

      <phase_2_scan_and_triage>
      Mark each category Clear / Partial / Missing:
        functional scope, domain model, persistence, interaction, data
        operations, ownership, non-functional, integration, migration,
        failure handling, success criteria

      Triage every Partial or Missing gap into exactly one bucket:
        CONVENTION - the codebase already decides it (AGENTS.md, an existing
          spec, lint/type config, an established pattern in neighboring
          code). Record the answer and the file it came from.
        DESIGN - engineering judgment with no consequence a person using the
          product would notice. Defer it to design.md.
        PRODUCT - the answer changes what a person can do, see, or rely on,
          and only the user can give it.

      In a codebase with strong conventions most gaps are CONVENTION or
      DESIGN. A long PRODUCT list means the triage is wrong — re-run Phase 1
      before asking anything.
      </phase_2_scan_and_triage>

      <phase_3_challenge_before_refining>
      Before refining the request, question it. All four checks are
      mandatory:

      1. SCOPE. If the request spans multiple independent subsystems, stop
         and propose splitting it into separate changes. Do not spend
         questions refining a change that needs decomposition.

      2. PREMISE. State, in one plain sentence, the strongest reason this
         change might be unnecessary, wrongly sized, or already served by an
         existing capability — then ask the user to confirm the goal behind
         the request. It is the first question you send. If after
         honest effort no such reason exists, record "premise check: no
         objection found" in discovery.md and move on. Do not manufacture an
         objection, and do not skip the check.

      3. LIFECYCLE WALK. For the requested behavior, walk its whole life:
         the first time someone opens it with nothing in it; normal use;
         heavy use (hundreds of items); mistakes and changes of mind;
         failure; and removal or leaving. Any stage the request is silent on
         is a gap — triage it in Phase 2's buckets like any other. A request
         is almost never complete as written; the stages it skips are where
         production surprises live.

      4. OWNERSHIP WALK. List every kind of thing this change stores, shows,
         or sends: a note, a photo, a reply, an address, a total computed
         from other people's records. For each, settle five answers:
           owner    - whose it is: the person who made it, a group, or the
                      product itself
           place    - where it travels beyond the product: nowhere, or an
                      outside service (email, payments, analytics, an AI
                      model)
           audience - who can see it: only the owner, people the owner
                      picks, a group, every signed-in person, anyone with
                      the link, anyone at all
           control  - who can change or delete it, and what happens to
                      other people's replies or copies when they do
           exit     - what happens to it when the owner deletes their
                      account, leaves a group, or is removed from one
         Mark a thing sensitive when a person would mind a stranger seeing
         it: contact details, location, money, health, private messages,
         anything about someone who is not the user.

         The codebase decides how a rule is enforced, never what the rule
         is. An answer is CONVENTION only when a context file or an existing
         spec states it for this kind of thing; a recipe for enforcing
         ownership in code is not that statement. Every other unsettled
         answer is a PRODUCT gap, and always INSIDE: it is this feature's
         own data. Its safe side is the narrowest setting: owned by the
         person who made it, travels nowhere, only they see or change it,
         gone with their account. The narrowest setting is a two-way door —
         nobody else ever saw the thing, so widening it later exposes
         nothing and its removal costs nobody else anything. Any wider
         answer, including one the request implies by naming sharing, a
         team, a profile, or other people, is a one-way door.
      </phase_3_challenge_before_refining>

      <phase_4_ask>
      Sort every PRODUCT gap with two yes/no calls:
        INSIDE — does it belong to the feature as the request, the premise
          answer, and the scope check bound it? Leaving a thing out is
          usually reversible, so a gap outside the feature is never asked:
          it becomes an out-of-scope line the user sees in Phase 5. A gap
          stays INSIDE when leaving it out makes the feature unsafe or a
          dead end, such as stored personal details with no way to remove
          them.
        ONE-WAY DOOR — would a wrong guess be costly to reverse once people
          use the feature? Data exposed, deleted, or sent outside the
          product; money; the shape of what people save (one or many, what
          it belongs to); behavior other people come to rely on; what
          happens to the people and data already here. Everything else is
          a two-way door.

      Ask every INSIDE one-way door, and only those. Each INSIDE two-way
      door is decided by you and goes to Phase 5 as ASSUMED. The user
      widens the feature, never you: when an answer brings a new gap
      inside, sort it with the same two calls. Asking is done when every
      INSIDE one-way door holds the user's answer. Ask first the doors whose answers others depend on, so a later
      question builds on an earlier answer rather than guessing it.

      If the user says "done", "good", or "no more" before then, decide
      each unasked one-way door at its safe side — the answer that exposes
      least and is easiest to reverse — and carry it to Phase 5 as ASSUMED,
      at the top of the list, saying it was never asked.

      One question per message, never batched: each question is written
      knowing every earlier answer. If an interactive question tool is
      available, use it: one question per call, at most 4 options, each
      label 5 words or fewer, always allow an open-ended answer. Never show
      the user the coverage scan, the triage, or the question queue.

      HOW TO PHRASE. Every question and every option describes something a
      person using the product would notice. The scan category is your
      reasoning, not your vocabulary. Translate before you speak:

        persistence      -> what is still there tomorrow, or on their phone
        domain model     -> what things someone names and sees; what they
                            can have many of
        interaction      -> the first time they open it with nothing in it;
                            what they see while waiting, or when it breaks
        data operations  -> can they change their mind, undo, find one
                            among hundreds
        ownership        -> whose it is; who else can see, change, or
                            delete it; where it goes outside the product;
                            what happens to it when they leave
        non-functional   -> how many, how slow before it feels broken, does
                            it work offline, keyboard and screen reader
        integration      -> what else in the product visibly changes
        migration        -> what happens to the people and data already here
        failure          -> what the person sees and can do when it fails
        success criteria -> what you would look at in a week to know it
                            worked

      THE COLLEAGUE TEST (run on every question before sending it): reread
      it as a colleague who has never seen a codebase. If any word would
      make them ask "what does that mean?", rewrite once. If it still
      fails, it was never a PRODUCT gap — move it to DESIGN and drop it.

        Fails:  "Should exports be idempotent if the request is retried?"
        Passes: "If someone clicks Export twice, do they get one file or
                 two?"

        Fails:  "Do we need optimistic UI for the save operation?"
        Passes: "While a save is finishing, can they keep editing, or does
                 the screen wait?"

        Fails:  "Should the notes table's policy scope reads to user_id?"
        Passes: "Can anyone besides the person who wrote a note ever read
                 it - a teammate, an admin, someone they send a link to?"

      OPTIONS ARE NEUTRAL. Deciding is the user's job; your job is making
      the costs visible. Write every option in the same parallel shape —
      the outcome, then what it costs — with no option written more
      attractively, marked as recommended or default, or placed first
      because you prefer it. You may append one factual tag where true:
      "(matches how <existing feature> works today)". Facts inform;
      recommendations decide, and deciding belongs to the user.

        Fails:  "Save to their account (Recommended - most robust)" vs
                "Keep on this device"
        Passes: "Still there next week on any device - needs sign-in" vs
                "Gone if this browser's data is cleared - no sign-in
                 needed"
      </phase_4_ask>

      <phase_5_confirm_assumptions>
      Every PRODUCT gap you did not ask about still gets decided — by you.
      Before writing discovery.md, send the user the full list of those
      decisions, each as one plain sentence they could veto, each marked
      ASSUMED, phrased with the same translation table as the questions.
      Follow it with every out-of-scope line from Phase 4, each one plain
      sentence naming what this change leaves out. Ask them to confirm or
      correct the list, and wait; an out-of-scope line they pull back in is
      sorted again as an INSIDE gap. One short read for
      the user is cheaper than one rebuild for everyone.

      THE LIST IS CHAT TEXT, NEVER TOOL INPUT. Write the whole list in the
      message body. An interactive question tool may follow it carrying only
      the short confirm question and its options — never the list itself: a
      question dialog is transient, and once it is dismissed or answered the
      list is gone from the conversation. Any message that asks about the
      assumptions carries the full list again, including a re-ask after a
      dismissed question or an unclear reply. Never refer to "the list" or
      "these assumptions" without the list in the same message.

        Fails:  question tool: "Here is everything I'm assuming: (1) ...
                (2) ... Do these stand?"
        Fails:  "The assumption list is waiting on you."
        Passes: message body lists every ASSUMED line, then asks: "Do these
                stand, or which would you change?"
      </phase_5_confirm_assumptions>

      <phase_6_write>
      Write discovery.md containing:
      - the coverage table, with each row's triage bucket
      - what was resolved by convention, and the file each answer came from
      - the premise check and the user's response to it
      - the ownership table: one row per thing from the ownership walk,
        each of its five answers with its source (the user's answer, a
        context or spec file, or ASSUMED)
      - each question as asked, with the user's answer verbatim
      - what was deferred to design.md
      - Assumptions: the confirmed list from Phase 5, still marked ASSUMED
      - Out of scope: the confirmed out-of-scope lines from Phase 5
      </phase_6_write>

      <final_check>
      Before each user-facing message and before writing discovery.md,
      verify:
      1. The premise was challenged exactly once (Phase 3.2).
      2. Questions were sent one per message. Every INSIDE one-way door was
         asked, or the user stopped early and each unasked one is ASSUMED
         at its safe side; no two-way door or outside gap was asked.
      3. No option anywhere is marked, ordered, or worded as recommended.
      4. The assumption list was shown and confirmed before the file was
         written — shown as chat text, in full, in every message that asked
         about it.
      5. Every thing the change stores, shows, or sends has an ownership
         row with all five answers sourced.
      6. Mechanical vocabulary check — these strings appear nowhere in any
         user-facing question, option, or assumption (this list is for
         verification only; generate from the translation table, not from
         this list): schema, migration, persistence, persist, endpoint,
         API, non-functional, idempotent, race condition, index, cache,
         transaction, state management, coupling, refactor, latency,
         throughput, backend, frontend, ACL, RLS, tenant, PII, Supabase,
         Postgres, SQL, policy, row security, bucket, JWT, token, session,
         table.
      </final_check>
    requires: []

  - id: proposal
    generates: proposal.md
    description: Why this change is worth making, and which capabilities it touches
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      discovery.md already exists and holds the user's answers. Do not re-ask
      those questions and do not run another coverage scan.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity, stated as what a
        person using the product cannot do today, or does badly. What problem
        does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new
        capabilities, modifications, or removals. Mark breaking changes with
        **BREAKING**.
      - **Non-Goals**: What this change deliberately does not do. Every
        lifecycle stage or capability discovery.md raised that this change
        will not address belongs here, stated plainly, so scope is a decision
        a reviewer can see rather than an omission they discover later.
      - **Capabilities**: This list is the contract with the specs phase:
        each capability listed here needs a corresponding spec file. Reuse
        the exact path of an existing capability discovery found instead of
        introducing a near-duplicate name; confirm paths with
        `openspec list --specs`.
        - **New Capabilities**: Each becomes a new
          `specs/<capability-path>/spec.md`. Use kebab-case for path segments
          you introduce (e.g., `user-auth` or `identity/user-auth`) and
          follow the project's existing spec organization.
        - **Modified Capabilities**: Existing capabilities whose REQUIREMENTS
          change; each needs a delta spec file. Only include if spec-level
          behavior changes (not just implementation details). Use the exact
          existing path under `openspec/specs/`. Leave empty if no
          requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Every change either declares at least one capability or sets
      `skip_specs: true` in the change's `.openspec.yaml`: `openspec validate`
      rejects a change with zero deltas otherwise. Use `skip_specs: true` only
      when no spec-level behavior changes (pure refactor, tooling, docs) -
      specs describe behavior, so if behavior does not change, no spec should
      change either. Do not invent a requirement just to satisfy validation.

      CARRY DISCOVERY FORWARD. Every answer in discovery.md appears here as
      either a stated goal or an explicit non-goal. Carry ASSUMED items
      forward as stated assumptions so a reviewer can challenge them. Items
      discovery deferred to design belong in design.md, not here.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      Do not embed executor directives (for example a "REQUIRED SUB-SKILL"
      line) in any artifact.

    requires:
      - discovery

  - id: specs
    generates: specs/**/*.md
    description: What the system must do, as scenarios anyone can check
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan. The two
      tests that govern everything below: (1) if the implementation can
      change without changing externally visible behavior, it does not
      belong in the spec; (2) if a scenario is not falsifiable, it is not
      written yet.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Keep out of specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      SCENARIOS MUST BE FALSIFIABLE. This is the artifact the user reviews
      to confirm the change does what they asked, so every THEN names
      something observable — a screen state, a message, a stored value, a
      count — that a reviewer could check and disagree with. State what
      actually happens, preferring the user-visible effect over the
      mechanism that produces it.

        Fails:  - **THEN** the export completes successfully
        Passes: - **THEN** a CSV file downloads containing one row per
                  task, including completed tasks

        Fails:  - **THEN** errors are handled gracefully
        Passes: - **THEN** the list stays on screen unchanged and a
                  message offers Retry

      EDGE CASES PER REQUIREMENT. For each requirement, account for each
      of these cases where it applies: the empty/first-use case, the
      failure case, the other-person case (if it touches a thing in
      discovery's ownership table), and limits or undo (if it changes
      data). Each one is either a scenario or one explicit line:
      "Out of scope: <case> — <one-line reason>". The other-person case is
      what a different signed-in person, and a signed-out visitor, get when
      they try to see or change the thing; it is never out of scope.

      CROSS-CHECK against discovery.md. Every answer the user gave, and
      every ownership row's audience, control, and exit answers, must
      appear here as a requirement or an explicit non-goal. If one does
      not, add it.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `openspec/specs/<capability-path>/spec.md` directly.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `openspec/specs/<capability-path>/spec.md`
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      #### Scenario: Export with no data yet
      - **WHEN** a user with no records clicks "Export"
      - **THEN** a CSV downloads containing only the header row

      Out of scope: scheduled/recurring exports — one-time manual export only
      in this change.

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      FINAL CHECK before finishing: every THEN passes the falsifiability
      test above; every requirement's empty, failure, other-person, and
      limit/undo cases are either scenarios or explicit out-of-scope lines;
      every discovery.md answer is a requirement or a non-goal.

    requires:
      - proposal

  - id: design
    generates: design.md
    description: How it will be built - engineering-facing, not a user review artifact
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      This artifact is engineering-facing: the one place engineering
      vocabulary belongs. Everything discovery.md triaged as DESIGN is
      resolved here, by you - do not take those back to the user.

      Before Decisions, load the skills the root AGENTS.md routes to for
      every area the change touches, and every touched unit's AGENTS.md.
      Where a skill's workflow conflicts with a unit's AGENTS.md, follow the
      unit and say so in Decisions.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Present 2-3 approaches with trade-offs before recommending one, and say in one line why each rejected option was rejected. (Recommending is correct here: these are engineering decisions the user delegated. Product-visible decisions were the user's and were made in discovery - do not reopen or override them.)
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation. Call out anything that could break existing behavior.
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that are not load-bearing. Omit if none.

      For each row of discovery's ownership table, name the mechanism that
      enforces its audience and control, taken from packages/db's ownership
      and exposure recipes and checked against the supabase skill's security
      checklist, and the test that proves a different person is refused.

      List every existing file or module this change touches, and say whether
      it is read, modified, or replaced. Follow the conventions discovery.md
      recorded rather than re-deciding them.

      A load-bearing question - one that would change the specs, the chosen
      approach, or the task breakdown - is resolved now. If resolving it
      needs the user, ask in the plain product language discovery.md used -
      one question per message, neutral parallel options, no recommended
      option - never in the vocabulary of this document.

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and, once written, the specs for
      requirements - if a section would only restate them, point to them
      instead.

    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist - engineering-facing, not a user review artifact
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Like design.md, this is engineering-facing.

      Before writing tasks, check design.md for Open Questions. If any of them
      is load-bearing, resolve it with the user first - in the same plain
      product language and neutral parallel options, with no recommended
      option, that discovery used - do not bake an unstated assumption into
      the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Fold setup, config, and scaffolding into the task that needs them.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A final
        group is for integration checks only, not for the tests and docs an
        earlier group owed.

      Example:
      ```
      ## 1. Export

      - [ ] 1.1 Add the CSV export function with its dependency and verify the export test passes
      - [ ] 1.2 Quote fields containing delimiters and verify unit tests cover quoting and delimiters
      - [ ] 1.3 Document the export command and verify it runs as written
      ```

      Do NOT embed instructions about which skill or sub-agent should execute
      these tasks.

      Before finishing: re-read the spec scenarios, edge cases included. If
      any scenario has no task that would satisfy it, add the missing task.

      Reference specs for what needs to be built, design for how to build it.

    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification - clarification questions
    that a user must answer go through the same product-language rules as
    discovery: plain words, neutral parallel options, no recommended option.
