packages:
  - packages/*
  - apps/*

# Every dependency in every workspace unit resolves through a catalog or the
# `workspace:` protocol -- never a literal version. This is the single rule that
# keeps the dependency tree coherent as the repo grows.
catalog:
  "@types/node": ^25.9.5
  "@vitest/coverage-v8": 5.0.1
  tstyche: 7.2.3
  tsx: ^4.20.0
  typescript: 7.0.2
  vitest: 5.0.1

# Named catalog so the whole Effect line moves in lockstep: bump the one version below and
# every unit follows. A dist-tag here (`rc`) would let a freshly resolved unit land on a newer
# release than the units already in the lockfile. `@effect/vitest` requires the Vitest major the
# `vitest` catalog entry names, so the two are bumped together.
catalogs:
  effect:
    "@effect/atom-react": 4.0.0-rc.116
    "@effect/platform-browser": 4.0.0-rc.116
    "@effect/platform-node": 4.0.0-rc.116
    "@effect/platform-node-shared": 4.0.0-rc.116
    "@effect/sql-pg": 4.0.0-rc.116
    "@effect/tsgo": 0.45.0
    "@effect/vitest": 4.0.0-rc.116
    effect: 4.0.0-rc.116

# `@effect/platform-node` depends on `platform-node-shared` with a caret range, which a
# prerelease resolver satisfies with the NEWEST rc -- one built against a newer `effect` than
# the catalog pins. Held to the catalog so the whole line really does move together.
overrides:
  "@effect/platform-node-shared": catalog:effect

engineStrict: true

# 48h supply-chain cooldown on new releases, with an exemption for the
# fast-moving Effect betas.
#
# NOTE: `buildPnpmPackage` re-resolves with `pnpm install --lockfile-only` inside
# a fixed-output derivation. A time-gated resolver in an FOD is a reproducibility
# hazard in principle; in practice the committed lockfile pins the versions, so
# this only bites if the lockfile is stale. Drop it if that trade is unwelcome.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"

resolvePeersFromWorkspaceRoot: false
sharedWorkspaceLockfile: true
strictPeerDependencies: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
